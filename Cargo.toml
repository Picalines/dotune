[package]
name = "dotune"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
derived-deref = "2.1.0"
itertools = "0.15.0"
mlua = { version = "0.12.0", features = ["lua55", "macros", "userdata-wrappers"] }
thiserror = "2.0.21"
which = "8.0.5"

[lints.clippy]
absolute_paths = "warn"
self_named_module_files = "deny"
std_instead_of_core = "warn"
