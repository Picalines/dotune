[tools]
rust = { version = "1.98", components = ["clippy", "rustfmt"] }

[tasks.publish]
depends = "lint"
run = "cargo publish"

[tasks.run]
alias = "r"
run = "cargo run -- --dry-run example"

[tasks.verify]
alias = "v"
run = [{ task = "format" }, { task = "lint" }, { task = "build" }]

[tasks.build]
alias = "b"
run = "cargo build --release"

[tasks.lint]
alias = "l"
depends = "lint:*"

[tasks.format]
alias = "f"
run = "cargo fmt"

[tasks."lint:fmt"]
run = "cargo fmt --check"

[tasks."lint:clippy"]
run = "cargo clippy"

[tasks."dev:install"]
depends = "build"
run = "mv ./target/release/dotune ~/bin"
